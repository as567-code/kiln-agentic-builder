[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "kiln-orchestrator"
version = "0.1.0"
description = "Trusted orchestration boundary for Kiln agent runs"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "openai==3.1.0",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["kiln_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
